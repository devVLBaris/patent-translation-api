spring.application.name=patent-translation
server.port=${PORT:8080}
server.address=${HOST:127.0.0.1}
translation.min-delay-ms=${MIN_DELAY_MS:5000}
translation.max-delay-ms=${MAX_DELAY_MS:15000}
translation.api-key=${API_KEY:dev-api-key}
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/swagger-ui.html
server.error.include-message=never
